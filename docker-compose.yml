services:
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: htp-gotenberg
    ports:
      - "3000:3000"
    command:
      - "gotenberg"
      - "--api-port=3000"

  weasyprint:
    build: ./weasyprint
    container_name: htp-weasyprint
    ports:
      - "5001:5000"
    environment:
      # glibc malloc 디버깅: 손상 조기 감지 + UAF 결정적 노출
      # 운영용으로는 끌 것 (성능 영향). 메모리 손상 백트레이스 채집용.
      MALLOC_CHECK_: "3"
      MALLOC_PERTURB_: "42"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"

  reactpdf:
    build: ./react-pdf
    container_name: htp-reactpdf
    ports:
      - "5002:5002"
    environment:
      NODE_ENV: production
      PORT: "5002"
